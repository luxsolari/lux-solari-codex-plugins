name: Release

# Six plugins live here and version independently, so a release names one of
# them: the tag is <plugin>-v<version>, e.g. whiting-v0.6.0. A repo-level tag
# would say nothing about which plugin moved.
on:
  push:
    tags:
      - "*-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish a release for, e.g. whiting-v0.6.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Split on the LAST -v: plugin names contain hyphens.
          PLUGIN="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "plugin=$PLUGIN"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the tag against the plugin manifest
        run: |
          # A tag that disagrees with the manifest would publish a release under
          # a version the plugin does not claim. Fail before anything is created.
          PLUGIN="${{ steps.resolve.outputs.plugin }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          MANIFEST="plugins/$PLUGIN/.codex-plugin/plugin.json"
          test -f "$MANIFEST" || { echo "No such plugin: $PLUGIN ($MANIFEST missing)"; exit 1; }
          ACTUAL=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$MANIFEST")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "Tag says $VERSION but $MANIFEST says $ACTUAL"; exit 1
          fi
          echo "$PLUGIN $VERSION matches its manifest"

      - name: Extract changelog section
        run: python3 scripts/extract_changelog.py "${{ steps.resolve.outputs.tag }}" > release_notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          TITLE="${{ steps.resolve.outputs.plugin }} v${{ steps.resolve.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes-file release_notes.md
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes-file release_notes.md
          fi
