name: Validate marketplace

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: python3 -m pip install PyYAML
      - name: Run parity validation
        run: |
          python3 -m unittest tests/test_marketplace.py tests/test_parity_inventory.py tests/test_host_portability.py tests/test_plugin_changelogs.py -v
          node --test plugins/three-axes-framework/tests/*.test.mjs
          python3 -m unittest plugins/sage-instructor/tests/test_check_progress_schema.py -v
          sh plugins/whiting/scripts/run_tests.sh
          python3 -m unittest plugins/lux-swiss/tests/test_theme_contract.py -v
          (cd plugins/hannah && python3 -m unittest discover -s tests -v)
          python3 -m unittest plugins/tri-swiss/tests/test_theme_contract.py -v
          python3 -m unittest plugins/lux-visual-systems/tests/test_visual_system_contract.py -v
          for plugin in plugins/*; do
            python3 scripts/validate_plugin.py "$plugin"
          done
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          git diff --check
